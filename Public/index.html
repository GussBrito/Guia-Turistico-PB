<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Guia PB</title>
</head>

<body>
    <div>

        <img src="logo.png" alt="logo" class="logo">
        <button id="botaoADD">Adicionar local</button>
    </div>

    <main id="listaLocais"></main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitulo">Adicionar Local</h2>
            <form id="formLocal">
                <input type="hidden" id="localId">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" required>
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" required></textarea>
                <label for="foto">URL da Foto:</label>
                <input type="text" id="foto" required>
                <button type="submit" id="salvarLocal">Salvar</button>
            </form>
        </div>
    </div>
    <!-- Modal de Exclusão -->
<div id="modalExclusao" class="modal">
    <div class="modal-content">
        <span class="close" onclick="fecharModalExclusao()">&times;</span>
        <h2>Tem certeza que deseja excluir?</h2>
        <p id="descricaoExclusao"></p>
        <button id="confirmarExclusao">Sim, excluir</button>
        <button onclick="fecharModalExclusao()">Cancelar</button>
    </div>
</div>


    <footer>
        <div class="footer-conteudo">
            <p> © 2025 desenvolvido por Gustavo Brito. Todos os direitos reservados</p>
            <nav>
                <ul>
                    <li><a href="https://github.com/GussBrito">contatos</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    
    <script src="script.js"></script>
</body>

</html>
